  </div>

  <h2>CRÉDITOS</h2>

  <p class="credit-line">
    RESPONSÁVEL: <strong>Victor Hugo Cesário Velloso</strong>
  </p>

  <p class="credit-line">
    DESENVOLVEDOR: <strong>Hebert Renan Velloso</strong>
  </p>

  <p class="credit-line">
    <strong>AB GAMES</strong>
  </p>

  <button type="button" class="menu-button"
    id="back-button" onclick="voltarMenu()">
    VOLTAR
  </button>

</div>

<div id="intro-screen">

  <video id="intro-video" playsinline preload="auto">
    <source
      src="https://raw.githubusercontent.com/abgamesbr/O-ULTIMO-SINAL./main/curtoVideoOficalAB.GAMES.mp4"
      type="video/mp4">
  </video>

  <div id="video-error">

    </button>
  </div>

<script>
function alternarSom() {
  var audio = document.getElementById("menu-audio");
  var button = document.getElementById("sound-button");

  if (audio.paused) {
    audio.play().then(function() {
      button.textContent = "🔇 DESLIGAR SOM";
    }).catch(function() {
      button.textContent = "SOM INDISPONÍVEL";
    });
  } else {
    audio.pause();
    button.textContent = "🔊 ATIVAR SOM";
  }
}

function iniciarJogo() {
  var audio = document.getElementById("menu-audio");
  var menu = document.getElementById("start");
  var credits = document.getElementById("credits-screen");
  var intro = document.getElementById("intro-screen");
  var video = document.getElementById("intro-video");
  var error = document.getElementById("video-error");

  audio.pause();

  menu.style.display = "none";
  credits.style.display = "none";
  intro.style.display = "flex";
  error.style.display = "none";

  video.currentTime = 0;

  video.play().catch(function() {
    error.style.display = "block";
  });
}

function abrirCreditos() {
  document.getElementById("start").style.display = "none";
  document.getElementById("credits-screen").style.display = "flex";

  document.getElementById("menu-audio").pause();
  document.getElementById("sound-button").textContent = "🔊 ATIVAR SOM";
}

function voltarMenu() {
  document.getElementById("credits-screen").style.display = "none";
  document.getElementById("start").style.display = "block";
}

function entrarNoJogo() {
  document.getElementById("intro-video").pause();

  window.location.href =
    "https://abgamesbr.github.io/AB-O-ULTIMO-SINAL-JOGO/";
}

document.getElementById("intro-video").addEventListener(
  "ended",
  entrarNoJogo
);

document.getElementById("intro-video").addEventListener(
  "error",
  function() {
    document.getElementById("video-error").style.display = "block";
  }
);
</script>
