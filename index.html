
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB GAMES | O Último Sinal</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}
#hud {
  position: fixed;
  z-index: 5;
  top: 15px;
  left: 16px;
  text-shadow: 0 2px 8px black;
  pointer-events: none;
}
#brand {
  color: #36aaff;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 4px;
}
#subtitle {
  font-size: 10px;
  letter-spacing: 4px;
  color: #aaa;
}
#message {
  position: fixed;
  z-index: 5;
  top: 15%;
  width: 100%;
  text-align: center;
  color: #ddd;
  text-shadow: 0 2px 10px black;
  pointer-events: none;
}
#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  pointer-events: none;
}
#start {
  position: fixed;
  z-index: 20;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(#242424,#050505 65%,#000);
  text-align: center;
  padding: 20px;
}
#start h1 {
  color: #38aaff;
  letter-spacing: 5px;
  font-size: 30px;
}
#start p { color: #aaa; }
button {
  cursor: pointer;
  color: white;
  background: #101820dd;
  border: 1px solid #54809c;
  border-radius: 9px;
  touch-action: none;
}
#start button {
  padding: 15px 38px;
  background: #087bc5;
  font-size: 17px;
  margin-top: 15px;
}
#controls {
  position: fixed;
  z-index: 6;
  bottom: 18px;
  left: 18px;
  display: grid;
  grid-template-columns: 52px 52px 52px;
  gap: 5px;
}
#controls button {
  height: 52px;
  font-size: 20px;
  background: #101820bb;
}
#flash {
  position: fixed;
  z-index: 6;
  bottom: 25px;
  right: 20px;
  width: 68px;
  height: 58px;
  font-size: 11px;
}
</style>
</head>

<body>
<div id="hud">
  <div id="brand">AB GAMES</div>
  <div id="subtitle">O ÚLTIMO SINAL</div>
</div>
<div id="message">Encontre uma saída...</div>
<div id="crosshair"></div>

<div id="start">
  <h1>O ÚLTIMO SINAL</h1>
  <p>Algumas portas deveriam permanecer fechadas.</p>
  <p>WASD para andar · Mouse para olhar</p>
  <p>No celular, use os botões e arraste a tela.</p>
  <button id="enter">ENTRAR NA CASA</button>
</div>

<div id="controls">
  <div></div><button data-key="w">▲</button><div></div>
  <button data-key="a">◀</button>
  <button data-key="s">▼</button>
  <button data-key="d">▶</button>
</div>
<button id="flash">LANTERNA</button>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// CENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070809);
scene.fog = new THREE.FogExp2(0x08090b, 0.025);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(0, 1.7, 8);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);

// TEXTURAS FEITAS PELO CÓDIGO
function wallTexture() {
  const c = document.createElement("canvas");
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext("2d");

  ctx.fillStyle = "#35332f";
  ctx.fillRect(0,0,512,512);

  for(let i=0;i<12000;i++) {
    const shade = Math.floor(35 + Math.random()*65);
    ctx.fillStyle = `rgba(${shade},${shade},${shade},0.15)`;
    ctx.fillRect(Math.random()*512,Math.random()*512,2,2);
  }

  for(let y=0;y<512;y+=64) {
    ctx.strokeStyle="#242321";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(512,y);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(c);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3,2);
  return texture;
}

function floorTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const ctx = c.getContext("2d");

  ctx.fillStyle = "#302a24";
  ctx.fillRect(0,0,512,512);

  for(let i=0;i<7000;i++) {
    const v = Math.floor(30+Math.random()*55);
    ctx.fillStyle=`rgba(${v},${v},${v},0.3)`;
    ctx.fillRect(Math.random()*512,Math.random()*512,3,2);
  }

  for(let y=0;y<512;y+=128) {
    ctx.strokeStyle="#171513";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(512,y);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(c);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(5,5);
  return texture;
}

const wallMat = new THREE.MeshStandardMaterial({
  map: wallTexture(), roughness: 1
});
const floorMat = new THREE.MeshStandardMaterial({
  map: floorTexture(), roughness: 1
});
const woodMat = new THREE.MeshStandardMaterial({
  color: 0x493326, roughness: 1
});
const darkMat = new THREE.MeshStandardMaterial({
  color: 0x171717, roughness: 1
});

// LUZES
scene.add(new THREE.HemisphereLight(0x687080,0x17120d,0.35));

const moon = new THREE.DirectionalLight(0x8a9bb4,0.5);
moon.position.set(-5,10,5);
moon.castShadow = true;
scene.add(moon);

// CONSTRUÇÃO
const colliders = [];

function box(x,y,z,w,h,d,material,angle=0,solid=false) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),material
  );
  obj.position.set(x,y,z);
  obj.rotation.y = angle;
  obj.castShadow = true;
  obj.receiveShadow = true;
  scene.add(obj);

  if(solid) {
    const c = Math.abs(Math.cos(angle));
    const s = Math.abs(Math.sin(angle));
    colliders.push({
      x,z,
      w:(w*c+d*s)/2+0.32,
      d:(w*s+d*c)/2+0.32
    });
  }
  return obj;
}

// CASA PRINCIPAL
box(0,-0.18,1.25,20,0.35,23.5,floorMat);
box(0,6.2,13,20,12.4,0.35,wallMat);
box(-10,6.2,1,0.35,12.4,24,wallMat);
box(10,6.2,1,0.35,12.4,24,wallMat);
box(0,12.3,1,20,0.35,24,darkMat);

// PAREDE DO FUNDO COM ABERTURA CENTRAL
box(-7,3,-11,6,6,0.35,wallMat);
box(7,3,-11,6,6,0.35,wallMat);
box(0,5.7,-11,8,0.6,0.35,wallMat);

// JANELAS
const glass = new THREE.MeshStandardMaterial({
  color:0x101b28,
  roughness:0.2,
  metalness:0.3
});
box(-9.77,3.8,-2,0.08,2.7,4,glass);
box(-9.68,3.8,-2,0.12,2.7,0.12,darkMat);
box(-9.68,3.8,-2,0.12,0.12,4,darkMat);
box(9.77,3.8,2,0.08,2.7,4,glass);
box(9.68,3.8,2,0.12,2.7,0.12,darkMat);
box(9.68,3.8,2,0.12,0.12,4,darkMat);

// ESCRITA ACIMA DA ESCADA
function writingTexture() {
  const c = document.createElement("canvas");
  c.width = 1024;
  c.height = 300;
  const ctx = c.getContext("2d");

  ctx.fillStyle="#171312";
  ctx.fillRect(0,0,1024,300);

  ctx.font="bold 62px Arial";
  ctx.textAlign="center";
  ctx.fillStyle="#a40d0d";
  ctx.shadowColor="#d00000";
  ctx.shadowBlur=12;
  ctx.fillText("QUEM ENTRA TEM QUE",512,105);
  ctx.fillText("TER SORTE PRA SAIR",512,190);

  // Tinta vermelha escorrida, efeito cenográfico
  ctx.shadowBlur=0;
  for(let i=0;i<35;i++) {
    const x=100+Math.random()*824;
    const y=195+Math.random()*35;
    const length=8+Math.random()*55;
    ctx.fillStyle="#790909";
    ctx.fillRect(x,y,3,length);
    ctx.beginPath();
    ctx.arc(x+1.5,y+length,2.5,0,Math.PI*2);
    ctx.fill();
  }

  return new THREE.CanvasTexture(c);
}

const sign = new THREE.Mesh(
  new THREE.PlaneGeometry(8,2.3),
  new THREE.MeshBasicMaterial({
    map:writingTexture()
  })
);
sign.position.set(0,4.4,-10.78);
scene.add(sign);

// ESCADA DIRETAMENTE ABAIXO DA ESCRITA
const stairMat = new THREE.MeshStandardMaterial({
  color:0x29231f,
  roughness:1
});

// Corredor e paredes laterais
box(-2.15,-1.5,-15,0.25,4,9,wallMat);
box(2.15,-1.5,-15,0.25,4,9,wallMat);

// Degraus descendo
for(let i=0;i<12;i++) {
  const z=-11.5-i*0.78;
  const y=-0.12-i*0.34;
  box(0,y,z,4,0.24,0.82,stairMat);
}

// Paredes do porão
box(-5,-3.2,-21,0.3,5,10,wallMat);
box(5,-3.2,-21,0.3,5,10,wallMat);
box(0,-5.65,-21,10,0.3,10,floorMat);
box(0,-0.6,-26,10,5,0.3,wallMat);

// LUZ FRACA NO PORÃO
const basementLight = new THREE.PointLight(0x783d24,1.5,8);
basementLight.position.set(0,-3.5,-23);
scene.add(basementLight);

// MÓVEIS
box(-6,0.9,2,4.5,1.2,1.5,woodMat,0.12,true);
box(-6,1.8,2.5,4.5,1.1,0.55,darkMat,0.12,true);
box(-8,1.5,1.4,0.6,1.3,1.8,woodMat,0.12,true);
box(-4,1.5,1.4,0.6,1.3,1.8,woodMat,0.12,true);

// MESA
box(-1.5,1.5,-2,3.8,0.18,2.1,woodMat,0.08,true);
for(const x of [-3,-0.1]) {
  for(const z of [-2.7,-1.3]) {
    box(x,0.7,z,0.16,1.5,0.16,woodMat,0,true);
  }
}

// CADEIRAS
function chair(x,z,a) {
  box(x,0.9,z,1,0.18,1,woodMat,a,true);
  box(x,1.7,z-0.42,1,1.5,0.16,woodMat,a,true);
  box(x-0.4,0.35,z-0.4,0.14,0.9,0.14,woodMat,a,true);
  box(x+0.4,0.35,z-0.4,0.14,0.9,0.14,woodMat,a,true);
  box(x-0.4,0.35,z+0.4,0.14,0.9,0.14,woodMat,a,true);
  box(x+0.4,0.35,z+0.4,0.14,0.9,0.14,woodMat,a,true);
}
chair(2,-2,0.7);
chair(-2,-4,1.5);

// ARMÁRIO E CAIXAS
box(7,1.2,-5,2.2,2.5,1.2,woodMat,0.8,true);
box(7,2.45,-5,2.2,0.15,1.2,darkMat,0.8,true);
box(-7,0.5,-7,1.3,1,1.2,woodMat,0.3,true);
box(4,0.4,3,1.2,0.8,1,woodMat,0.9,true);
box(5,0.3,-7,1.4,0.6,1.1,woodMat,0.4,true);

// PAPÉIS
const paperMat=matPaper();
function matPaper() {
  return new THREE.MeshStandardMaterial({
    color:0xaaa18c,
    roughness:1,
    side:THREE.DoubleSide
  });
}
for(let i=0;i<28;i++) {
  box(
    -8+Math.random()*16,
    0.015,
    -9+Math.random()*15,
    0.35+Math.random()*0.5,
    0.025,
    0.3+Math.random()*0.35,
    paperMat,
    Math.random()*3
  );
}

// LANTERNA
const flashlight=new THREE.SpotLight(
  0xe8edff,90,25,Math.PI/7,0.4,1
);
camera.add(flashlight);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight.target);
scene.add(camera);

let lightOn=true;
document.getElementById("flash").onclick=()=>{
  lightOn=!lightOn;
  flashlight.visible=lightOn;
};

// CONTROLES
const keys={};
addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});
addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

document.querySelectorAll("[data-key]").forEach(b=>{
  const k=b.dataset.key;
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[k]=true;
  });
  for(const ev of ["pointerup","pointerleave","pointercancel"]) {
    b.addEventListener(ev,()=>keys[k]=false);
  }
});

// OLHAR COM MOUSE
let yaw=0,pitch=0;
renderer.domElement.addEventListener("click",()=>{
  if(!matchMedia("(pointer: coarse)").matches) {
    renderer.domElement.requestPointerLock?.();
  }
});
document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement===renderer.domElement) {
    yaw-=e.movementX*0.002;
    pitch-=e.movementY*0.002;
    pitch=THREE.MathUtils.clamp(pitch,-1.3,1.3);
  }
});

// OLHAR COM TOQUE
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch") {
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
  }
});
renderer.domElement.addEventListener("pointermove",e=>{
  if(dragging&&e.pointerType==="touch") {
    yaw-=(e.clientX-lastX)*0.006;
    pitch-=(e.clientY-lastY)*0.006;
    pitch=THREE.MathUtils.clamp(pitch,-1.3,1.3);
    lastX=e.clientX;
    lastY=e.clientY;
  }
});
renderer.domElement.addEventListener("pointerup",()=>dragging=false);
renderer.domElement.addEventListener("pointercancel",()=>dragging=false);

// COLISÃO SIMPLES COM MÓVEIS
function blocked(x,z) {
  return colliders.some(c=>
    Math.abs(x-c.x)<c.w &&
    Math.abs(z-c.z)<c.d
  );
}

// INÍCIO DO JOGO
let started=false;
document.getElementById("enter").onclick=()=>{
  started=true;
  document.getElementById("start").style.display="none";
};

// MOVIMENTO E DESCIDA PELA ESCADA
function updatePlayer() {
  if(!started) return;

  const dir=new THREE.Vector3();

  if(keys.w||keys.arrowup) dir.z-=1;
  if(keys.s||keys.arrowdown) dir.z+=1;
  if(keys.a||keys.arrowleft) dir.x-=1;
  if(keys.d||keys.arrowright) dir.x+=1;

  if(dir.length()>0) {
    dir.normalize();
    dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);

    const speed=0.065;
    const nx=THREE.MathUtils.clamp(
      camera.position.x+dir.x*speed,-9.4,9.4
    );
    const nz=camera.position.z+dir.z*speed;

    // Na área da escada, o jogador desce gradualmente.
    const stairZone = nx > -1.65 && nx < 1.65 &&
                      nz < -10.2 && nz > -20.8;

    if(!stairZone && (nz < -10.2 || nz > 12.3)) {
      // Limite do caminho fora da escada
    } else {
      if(!blocked(nx,camera.position.z)) {
        camera.position.x=nx;
      }
      if(!blocked(camera.position.x,nz)) {
        camera.position.z=nz;
      }
    }

    // Altura acompanha os degraus.
    const z=camera.position.z;
    if(camera.position.x > -1.65 &&
       camera.position.x < 1.65 &&
       z < -10.2 && z > -20.8) {
      camera.position.y=1.7+(-10.2-z)*0.39;
    } else if(z <= -20.8) {
      camera.position.y=-2.4;
    } else {
      camera.position.y=1.7;
    }

    camera.position.z=THREE.MathUtils.clamp(
      camera.position.z,-23,12.3
    );
  }
}

// ANIMAÇÃO
function animate() {
  requestAnimationFrame(animate);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
  updatePlayer();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
