
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AB GAMES — O Último Sinal</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #030405;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

canvas { display: block; }

#hud {
  position: fixed;
  top: 12px;
  left: 18px;
  z-index: 5;
  pointer-events: none;
  text-shadow: 0 2px 8px black;
}

#hud h2 {
  margin: 0;
  color: #65aaff;
  letter-spacing: 2px;
  font-size: 20px;
}

#message {
  margin-top: 6px;
  font-size: 13px;
}

#instructions {
  position: fixed;
  top: 15px;
  right: 18px;
  text-align: right;
  font-size: 13px;
  text-shadow: 0 2px 8px black;
  pointer-events: none;
}

#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 24px;
  pointer-events: none;
  z-index: 4;
}

#controls {
  position: fixed;
  bottom: 18px;
  left: 18px;
  display: grid;
  grid-template-columns: repeat(3, 55px);
  gap: 5px;
  z-index: 6;
}

button {
  background: #07172bdc;
  color: white;
  border: 1px solid #168bff;
  border-radius: 9px;
  font-size: 20px;
  touch-action: none;
}

#controls button {
  width: 55px;
  height: 55px;
}

#flash {
  position: fixed;
  bottom: 25px;
  right: 18px;
  z-index: 6;
  padding: 14px;
  font-size: 13px;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: #020305eF;
  text-align: center;
  padding: 25px;
}

#start h1 {
  color: #168bff;
  letter-spacing: 4px;
  text-shadow: 0 0 18px #087bff;
}

#start button {
  padding: 15px 28px;
  margin-top: 20px;
  font-size: 16px;
}

@media (max-width: 600px) {
  #instructions { display: none; }
  #hud h2 { font-size: 15px; }
  #message { font-size: 11px; }
}
</style>
</head>

<body>

<div id="hud">
  <h2>AB GAMES — O ÚLTIMO SINAL</h2>
  <div id="message">Explore a casa e descubra o que aconteceu...</div>
</div>

<div id="instructions">
  Mouse: olhar ao redor<br>
  WASD: movimentar
</div>

<div id="crosshair">+</div>

<div id="controls">
  <span></span><button data-key="w">▲</button><span></span>
  <button data-key="a">◀</button>
  <button data-key="s">▼</button>
  <button data-key="d">▶</button>
</div>

<button id="flash">LANTERNA</button>

<div id="start">
  <h1>O ÚLTIMO SINAL</h1>
  <p>Você entrou em uma casa abandonada.</p>
  <p>Mas será que está sozinho?</p>
  <button id="enter">ENTRAR NA CASA</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030405);
scene.fog = new THREE.FogExp2(0x030405, 0.035);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 100
);

camera.position.set(0, 1.65, 8);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x687080, 0x17100a, 0.35));

function mat(color, roughness = 0.95) {
  return new THREE.MeshStandardMaterial({ color, roughness });
}

const wallMat = mat(0x393632);
const floorMat = mat(0x30251d);
const woodMat = mat(0x38251a);
const darkMat = mat(0x151515);

function box(x,y,z,w,h,d,material,rotationY=0) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), material
  );
  obj.position.set(x,y,z);
  obj.rotation.y = rotationY;
  scene.add(obj);
  return obj;
}

// CASA MAIOR
box(0,-0.18,0,20,0.35,26,floorMat);
box(0,6.2,-13,20,12.4,0.35,wallMat);
box(-10,6.2,0,0.35,12.4,26,wallMat);
box(10,6.2,0,0.35,12.4,26,wallMat);
box(0,12.3,0,20,0.35,26,mat(0x171717));

// Parede frontal com abertura de entrada
box(-7,3,13,6,6,0.35,wallMat);
box(7,3,13,6,6,0.35,wallMat);
box(0,5.5,13,8,1,0.35,wallMat);

// Janelas
box(-9.78,3.8,-2,0.08,2.5,4,mat(0x070d15));
box(-9.7,3.8,-2,0.12,0.12,4,mat(0x292929));
box(-9.7,3.8,-2,0.12,2.5,0.12,mat(0x292929));

// MÓVEIS BAGUNÇADOS
// Sofá
box(-6,0.9,2,4.5,1.2,1.5,mat(0x33251e),0.12);
box(-6,1.8,2.5,4.5,1.1,0.55,mat(0x241d19),0.12);
box(-8,1.5,1.4,0.6,1.3,1.8,woodMat,0.12);
box(-4,1.5,1.4,0.6,1.3,1.8,woodMat,0.12);

// Mesa
box(-1.5,1.5,-2,3.8,0.18,2.1,woodMat,0.08);
for (const x of [-3,-0.1])
 for (const z of [-2.7,-1.3])
  box(x,0.7,z,0.16,1.5,0.16,woodMat);

// Cadeiras
function chair(x,z,angle) {
  box(x,0.9,z,1,0.18,1,woodMat,angle);
  box(x,1.7,z-0.42,1,1.5,0.16,woodMat,angle);
  box(x-0.4,0.35,z-0.4,0.14,0.9,0.14,woodMat,angle);
  box(x+0.4,0.35,z-0.4,0.14,0.9,0.14,woodMat,angle);
  box(x-0.4,0.35,z+0.4,0.14,0.9,0.14,woodMat,angle);
  box(x+0.4,0.35,z+0.4,0.14,0.9,0.14,woodMat,angle);
}
chair(2,-2,0.7);
chair(-2,-4,1.5);

// Armário tombado
box(7,1.2,-5,2.2,2.5,1.2,woodMat,0.8);
box(7,2.45,-5,2.2,0.15,1.2,darkMat,0.8);

// Caixas e objetos espalhados
box(-7,0.5,-7,1.3,1,1.2,woodMat,0.3);
box(4,0.4,3,1.2,0.8,1,woodMat,0.9);
box(5,0.3,-7,1.4,0.6,1.1,woodMat,0.4);

// Papéis no chão
const paperMat = mat(0xaaa18c);
for (let i=0;i<28;i++) {
  const p = box(
    -8 + Math.random()*16,
    0.015,
    -10 + Math.random()*20,
    0.35 + Math.random()*0.5,
    0.025,
    0.3 + Math.random()*0.35,
    paperMat,
    Math.random()*3
  );
}

// ESCADA PARA O PORÃO
box(7,-0.1,-3,4,0.25,7,darkMat);

for (let i=0;i<13;i++) {
  box(
    7,
    -0.12-i*0.27,
    -1.2-i*0.48,
    3.2,
    0.22,
    0.55,
    mat(0x39322c)
  );
}

box(5.25,-0.1,-4,0.18,2.8,7,woodMat);
box(8.75,-0.1,-4,0.18,2.8,7,woodMat);

// Parede do fundo do porão
box(7,-3.8,-8,4,5,0.25,wallMat);

// ESCRITA VERMELHA ESCORRENDO
const signCanvas = document.createElement('canvas');
signCanvas.width = 1200;
signCanvas.height = 360;
const ctx = signCanvas.getContext('2d');

ctx.clearRect(0,0,1200,360);
ctx.font = 'bold 76px Arial';
ctx.textAlign = 'center';
ctx.fillStyle = '#650909';
ctx.shadowColor = '#260000';
ctx.shadowBlur = 10;
ctx.fillText('QUEM ENTRA TEM QUE',600,125);
ctx.fillText('TER SORTE PRA SAIR',600,225);
ctx.shadowBlur = 0;

// Pingos decorativos de tinta vermelha
ctx.strokeStyle = '#640606';
ctx.fillStyle = '#640606';

for(let i=0;i<48;i++) {
  const x = 80 + Math.random()*1040;
  const y = 130 + Math.random()*100;
  const length = 15 + Math.random()*100;
  ctx.lineWidth = 2 + Math.random()*7;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x,y+length);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x,y+length,ctx.lineWidth/2,0,Math.PI*2);
  ctx.fill();
}

const signTexture = new THREE.CanvasTexture(signCanvas);
const sign = new THREE.Mesh(
  new THREE.PlaneGeometry(7,2.1),
  new THREE.MeshBasicMaterial({
    map: signTexture,
    transparent: true,
    side: THREE.DoubleSide
  })
);
sign.position.set(0,3.7,-12.78);
scene.add(sign);

// LANTERNA
const flashlight = new THREE.SpotLight(
  0xffe7bd, 90, 24, Math.PI/7, 0.45, 1.4
);
camera.add(flashlight);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight.target);

// Movimento e câmera
const keys = {};
let yaw = 0;
let pitch = 0;
let locked = false;
let flashlightOn = true;
let started = false;

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()] = true;
});
document.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()] = false;
});

document.querySelectorAll('[data-key]').forEach(btn=>{
  const key = btn.dataset.key;
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    keys[key] = true;
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
    btn.addEventListener(ev,()=>keys[key]=false);
  });
});

// Mouse: clique para capturar o cursor
renderer.domElement.addEventListener('click',()=>{
  if(started && matchMedia('(pointer:fine)').matches) {
    renderer.domElement.requestPointerLock?.();
  }
});

document.addEventListener('pointerlockchange',()=>{
  locked = document.pointerLockElement === renderer.domElement;
});

document.addEventListener('mousemove',e=>{
  if(!locked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = THREE.MathUtils.clamp(pitch,-1.35,1.35);
});

// Celular: arrastar o dedo para olhar
let touching = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType === 'touch') {
    touching = true;
    lastX = e.clientX;
    lastY = e.clientY;
  }
});

window.addEventListener('pointerup',()=>touching=false);
window.addEventListener('pointercancel',()=>touching=false);

window.addEventListener('pointermove',e=>{
  if(!touching || e.pointerType !== 'touch') return;
  yaw -= (e.clientX-lastX)*0.004;
  pitch -= (e.clientY-lastY)*0.004;
  pitch = THREE.MathUtils.clamp(pitch,-1.35,1.35);
  lastX=e.clientX;
  lastY=e.clientY;
});

// Lanterna
document.getElementById('flash').onclick=()=>{
  flashlightOn = !flashlightOn;
  flashlight.visible = flashlightOn;
};

// Iniciar
document.getElementById('enter').onclick=()=>{
  started = true;
  document.getElementById('start').style.display='none';
  if(matchMedia('(pointer:fine)').matches) {
    renderer.domElement.requestPointerLock?.();
  }
};

// Loop
function animate() {
  requestAnimationFrame(animate);

  if(started) {
    const speed = 0.075;
    const dir = new THREE.Vector3();

    if(keys.w || keys.arrowup) dir.z -= 1;
    if(keys.s || keys.arrowdown) dir.z += 1;
    if(keys.a || keys.arrowleft) dir.x -= 1;
    if(keys.d || keys.arrowright) dir.x += 1;

    dir.normalize();
    dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);

    camera.position.x += dir.x*speed;
    camera.position.z += dir.z*speed;

    camera.position.x = THREE.MathUtils.clamp(camera.position.x,-9,9);
    camera.position.z = THREE.MathUtils.clamp(camera.position.z,-12,12);

    camera.rotation.order='YXZ';
    camera.rotation.set(pitch,yaw,0);
  }

  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
