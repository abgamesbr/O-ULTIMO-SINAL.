
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AB GAMES - O Último Sinal</title>
<style>
* { box-sizing: border-box; }
body { margin:0; overflow:hidden; background:#000; font-family:Arial; }
#hud {
  position:fixed; top:15px; left:15px;
  color:#38aaff; z-index:3; letter-spacing:3px;
  font-weight:bold; text-shadow:0 2px 8px #000;
}
#hint {
  position:fixed; top:48px; left:15px;
  color:#aaa; font-size:10px; letter-spacing:2px;
}
#start {
  position:fixed; inset:0; z-index:10;
  background:radial-gradient(#202020,#000);
  color:white; display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  text-align:center;
}
#start h1 { color:#38aaff; letter-spacing:4px; }
#start button {
  padding:15px 35px; background:#087bc5;
  border:0; border-radius:7px; color:white;
  font-size:17px;
}
#controls {
  position:fixed; bottom:15px; left:15px;
  display:grid; grid-template-columns:52px 52px 52px;
  gap:5px; z-index:5;
}
#controls button,#lamp {
  height:52px; border:1px solid #777;
  border-radius:9px; color:white;
  background:#111c; font-size:20px;
  touch-action:none;
}
#lamp {
  position:fixed; right:18px; bottom:25px;
  z-index:5; width:65px; font-size:11px;
}
</style>
</head>
<body>

<div id="hud">AB GAMES</div>
<div id="hint">O ÚLTIMO SINAL</div>

<div id="start">
  <h1>O ÚLTIMO SINAL</h1>
  <p>Há algo esperando lá embaixo...</p>
  <p>WASD para andar · Mouse para olhar</p>
  <p>No celular, use os botões e arraste a tela.</p>
  <button id="enter">ENTRAR</button>
</div>

<div id="controls">
  <div></div><button data-key="w">▲</button><div></div>
  <button data-key="a">◀</button>
  <button data-key="s">▼</button>
  <button data-key="d">▶</button>
</div>
<button id="lamp">LANTERNA</button>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// CENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030405);
scene.fog = new THREE.Fog(0x030405, 5, 19);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth/innerHeight, 0.1, 70
);
camera.position.set(0,1.7,4);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// MATERIAIS
const wallMat = new THREE.MeshStandardMaterial({
  color:0x393633, roughness:1
});
const floorMat = new THREE.MeshStandardMaterial({
  color:0x292522, roughness:1
});
const stairMat = new THREE.MeshStandardMaterial({
  color:0x28221e, roughness:1
});
const railMat = new THREE.MeshStandardMaterial({
  color:0x171717, roughness:1
});

// ILUMINAÇÃO MUITO FRACA
scene.add(new THREE.AmbientLight(0x252936,0.12));

const flashlight = new THREE.SpotLight(
  0xdce5ff, 24, 9, Math.PI/8, 0.65, 1.5
);
camera.add(flashlight);
flashlight.position.set(0,0,0);
flashlight.target.position.set(0,0,-1);
camera.add(flashlight.target);
scene.add(camera);

let lampOn = true;
document.getElementById("lamp").onclick = () => {
  lampOn = !lampOn;
  flashlight.visible = lampOn;
};

// CONSTRUÇÃO
function box(x,y,z,w,h,d,material) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),material
  );
  obj.position.set(x,y,z);
  obj.castShadow = true;
  obj.receiveShadow = true;
  scene.add(obj);
  return obj;
}

// CÔMODO FECHADO COM ABERTURA NO CHÃO
// O buraco fica no centro, perto da parede da escrita.
box(-3.75,-0.2,0,4.5,0.4,12,floorMat);
box(3.75,-0.2,0,4.5,0.4,12,floorMat);
box(0,-0.2,4.5,3,0.4,3,floorMat);
box(0,-0.2,-5,3,0.4,2,floorMat);

// PAREDES
box(0,2.5,-6,12,5,0.3,wallMat);
box(0,2.5,6,12,5,0.3,wallMat);
box(-6,2.5,0,0.3,5,12,wallMat);
box(6,2.5,0,0.3,5,12,wallMat);

// TETO
box(0,5.1,0,12,0.3,12,wallMat);

// ESCRITA NA PAREDE
function makeWriting() {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 300;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#17100f";
  ctx.fillRect(0,0,1024,300);

  ctx.textAlign = "center";
  ctx.font = "bold 66px Arial";
  ctx.fillStyle = "#a10c0c";
  ctx.shadowColor = "#e00000";
  ctx.shadowBlur = 13;
  ctx.fillText("NÃO OLHE PARA TRÁS.",512,110);
  ctx.fillText("ELE JÁ ESTÁ AQUI.",512,205);

  // Marcas de tinta escorrida
  ctx.shadowBlur = 0;
  for(let i=0;i<32;i++) {
    const x = 80 + Math.random()*864;
    const y = 210 + Math.random()*30;
    const h = 8 + Math.random()*35;
    ctx.fillStyle = "#790909";
    ctx.fillRect(x,y,3,h);
  }

  return new THREE.CanvasTexture(canvas);
}

const sign = new THREE.Mesh(
  new THREE.PlaneGeometry(9,2.6),
  new THREE.MeshBasicMaterial({map:makeWriting()})
);
sign.position.set(0,3.4,-5.82);
scene.add(sign);

// ESCADA DESCENDO PELO BURACO
// Os degraus vão ficando mais baixos conforme avançam.
for(let i=0;i<12;i++) {
  const z = 3.1 - i*0.72;
  const y = -0.15 - i*0.34;
  box(0,y,z,2.8,0.22,0.76,stairMat);
}

// PAREDES LATERAIS DA ESCADA
box(-1.55,-1.8,-0.9,0.22,3.8,10,railMat);
box(1.55,-1.8,-0.9,0.22,3.8,10,railMat);

// CORREDOR SUBTERRÂNEO
box(0,-4.4,-5.5,3.3,0.3,5,floorMat);
box(0,-2.5,-8,3.3,4,0.3,wallMat);
box(-1.7,-2.5,-5.5,0.3,4,5,wallMat);
box(1.7,-2.5,-5.5,0.3,4,5,wallMat);

// MOVIMENTO
const keys = {};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll("[data-key]").forEach(b=>{
  const k=b.dataset.key;
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[k]=true;
  });
  for(const ev of ["pointerup","pointerleave","pointercancel"]) {
    b.addEventListener(ev,()=>keys[k]=false);
  }
});

// OLHAR COM MOUSE E TOQUE
let yaw=0,pitch=0;
renderer.domElement.addEventListener("click",()=>{
  if(!matchMedia("(pointer:coarse)").matches)
    renderer.domElement.requestPointerLock?.();
});

document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement===renderer.domElement) {
    yaw-=e.movementX*0.002;
    pitch-=e.movementY*0.002;
    pitch=THREE.MathUtils.clamp(pitch,-1.2,1.2);
  }
});

let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch") {
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
  }
});
renderer.domElement.addEventListener("pointermove",e=>{
  if(dragging && e.pointerType==="touch") {
    yaw-=(e.clientX-lastX)*0.006;
    pitch-=(e.clientY-lastY)*0.006;
    pitch=THREE.MathUtils.clamp(pitch,-1.2,1.2);
    lastX=e.clientX;
    lastY=e.clientY;
  }
});
renderer.domElement.addEventListener("pointerup",()=>dragging=false);
renderer.domElement.addEventListener("pointercancel",()=>dragging=false);

// COLISÕES DAS PAREDES
function collides(x,z,y) {
  const r=0.28;

  // Paredes do cômodo
  if(x < -5.55 || x > 5.55) return true;
  if(z > 5.55) return true;

  // Parede do fundo: permite a passagem pelo vão da escada
  if(z < -5.75 && y > -0.5) return true;

  // Protege as laterais do vão e da escada
  const inStairs = z < 3.1 && z > -5.8;
  if(inStairs && Math.abs(x) > 1.25) return true;

  // Paredes do corredor inferior
  if(y < -2.2 && Math.abs(x)>1.3) return true;

  return false;
}

// INICIAR
let started=false;
document.getElementById("enter").onclick=()=>{
  started=true;
  document.getElementById("start").style.display="none";
};

// MOVIMENTO COM DESCIDA GRADUAL
function update() {
  if(!started) return;

  const dir=new THREE.Vector3();
  if(keys.w||keys.arrowup) dir.z-=1;
  if(keys.s||keys.arrowdown) dir.z+=1;
  if(keys.a||keys.arrowleft) dir.x-=1;
  if(keys.d||keys.arrowright) dir.x+=1;

  if(dir.lengthSq()>0) {
    dir.normalize();
    dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);

    const speed=0.055;
    const nx=camera.position.x+dir.x*speed;
    const nz=camera.position.z+dir.z*speed;

    const stairStart=3.1;
    const stairEnd=-5.0;
    const onStairs=nz<stairStart && nz>stairEnd &&
                   Math.abs(nx)<1.25;

    let nextY=1.7;

    if(onStairs) {
      const progress=(stairStart-nz)/(stairStart-stairEnd);
      nextY=1.7-progress*4.0;
    } else if(nz<=stairEnd) {
      nextY=-2.3;
    }

    if(!collides(nx,camera.position.z,camera.position.y)) {
      camera.position.x=nx;
    }
    if(!collides(camera.position.x,nz,nextY)) {
      camera.position.z=nz;
      camera.position.y=nextY;
    }
  }
}

// ANIMAÇÃO
function animate() {
  requestAnimationFrame(animate);
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
  update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
