
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB GAMES - O ÚLTIMO SINAL</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#start {
    width: 100%;
    height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
        url("video da tela inicial AB GAMES.gif") center/cover no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.logo {
    color: #00aaff;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 35px;
    text-shadow: 0 0 15px #008cff;
}

h1 {
    font-size: clamp(35px, 7vw, 65px);
    letter-spacing: 5px;
    text-shadow: 0 0 20px black;
    margin-bottom: 35px;
}

.menu-button {
    width: 220px;
    padding: 15px;
    margin: 8px;
    background: rgba(0, 0, 0, .75);
    border: 2px solid #008cff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.menu-button:hover {
    background: #008cff;
    box-shadow: 0 0 20px #008cff;
}

#creditos {
    display: none;
    background: rgba(0,0,0,.95);
    padding: 30px;
    border: 1px solid #008cff;
    max-width: 90%;
}

#creditos p {
    margin: 12px;
}

#som {
    position: absolute;
    right: 20px;
    top: 20px;
    background: rgba(0,0,0,.7);
    border: 1px solid #008cff;
    color: white;
    padding: 10px 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="start">

    <button id="som" onclick="alternarSom()">🔊 SOM</button>

    <div class="logo">AB GAMES</div>

    <h1>O ÚLTIMO SINAL</h1>

    <button class="menu-button" onclick="iniciarJogo()">
        JOGAR
    </button>

    <button class="menu-button" onclick="abrirCreditos()">
        CRÉDITOS
    </button>

    <div id="creditos">
        <h2>CRÉDITOS</h2>
        <p>Responsável: Victor Hugo Cesário Velloso</p>
        <p>Desenvolvedor: Hebert Renan Velloso</p>
        <p>AB GAMES</p>

        <button class="menu-button" onclick="voltarMenu()">
            VOLTAR
        </button>
    </div>

</div>

<audio id="audioMenu" loop>
    <source src="efeito sonoro tela inicial do jogo ULTIMO SINAL - AB GAMES.mp3" type="audio/mpeg">
</audio>

<script>
function iniciarJogo() {
    window.location.href =
    "https://abgamesbr.github.io/AB-O-ULTIMO-SINAL-JOGO/";
}

function abrirCreditos() {
    document.querySelector("h1").style.display = "none";
    document.querySelector(".logo").style.display = "none";

    document.querySelectorAll(".menu-button").forEach(botao => {
        botao.style.display = "none";
    });

    document.getElementById("creditos").style.display = "block";
}

function voltarMenu() {
    document.getElementById("creditos").style.display = "none";

    document.querySelector("h1").style.display = "block";
    document.querySelector(".logo").style.display = "block";

    document.querySelectorAll(".menu-button").forEach(botao => {
        botao.style.display = "block";
    });
}

function alternarSom() {
    const audio = document.getElementById("audioMenu");
    const botao = document.getElementById("som");

    if (audio.paused) {
        audio.play();
        botao.innerText = "🔊 SOM";
    } else {
        audio.pause();
        botao.innerText = "🔇 SOM";
    }
}
</script>

</body>
</html>
