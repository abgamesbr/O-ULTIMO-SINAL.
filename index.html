
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AB GAMES — O Último Sinal</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
}

#start {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.65)),
    url("video%20da%20tela%20inicial%20AB%20GAMES.gif")
    center center / cover no-repeat;
}

#brand {
  position: absolute;
  top: 25px;
  left: 25px;
  color: #35aaff;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 4px;
  text-shadow: 0 2px 10px black;
}

h1 {
  position: absolute;
  top: 50%;
  right: 30px;
  margin: 0;
  color: #e00000;
  font-family: 'Creepster', Georgia, serif;
  font-size: clamp(80px, 11vw, 145px);
  font-weight: normal;
  line-height: 0.85;
  letter-spacing: 5px;
  text-align: right;
  transform: translateY(-50%) rotate(-8deg);
  transform-origin: center right;
  text-shadow: 0 0 18px #8b0000, 2px 3px 18px black;
}

.menu-button {
  position: absolute;
  left: 7%;
  background: transparent;
  border: none;
  padding: 0;
  color: #e00000;
  font-family: 'Creepster', Georgia, serif;
  font-size: 48px;
  letter-spacing: 3px;
  text-shadow: 0 0 12px #8b0000, 2px 3px 12px black;
  cursor: pointer;
  transition: 0.3s;
}

.menu-button:hover {
  color: #ff3333;
  transform: scale(1.12);
}

#jogar {
  top: 43%;
}

#creditos {
  top: 53%;
}

/* BOTÃO DE SOM */
#sound-button {
  position: absolute;
  right: 25px;
  bottom: 25px;
  background: rgba(0,0,0,0.5);
  border: 1px solid #777;
  border-radius: 5px;
  padding: 10px 15px;
  color: white;
  font-size: 12px;
  cursor: pointer;
}

/* TELA DE CRÉDITOS */
#credits-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background:
    linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.96)),
    url("video%20da%20tela%20inicial%20AB%20GAMES.gif")
    center / cover no-repeat;
  color: white;
  text-align: center;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#credits-screen h2 {
  color: #e00000;
  font-family: 'Creepster', Georgia, serif;
  font-size: 75px;
  font-weight: normal;
  margin: 0 0 35px;
  text-shadow: 0 0 18px #8b0000;
}

.credit-line {
  font-size: 21px;
  letter-spacing: 2px;
  margin: 13px;
  text-shadow: 0 2px 10px black;
}

.credit-line strong {
  color: #35aaff;
}

#back-button {
  position: static;
  margin-top: 35px;
  font-size: 38px;
}

#footer {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  color: #aaa;
  font-size: 11px;
  letter-spacing: 3px;
  text-shadow: 0 2px 10px black;
}

@media (max-width: 600px) {
  #brand {
    top: 18px;
    left: 15px;
    font-size: 16px;
  }

  h1 {
    top: 50%;
    right: 15px;
    font-size: 78px;
  }

  .menu-button {
    left: 7%;
    font-size: 38px;
  }

  #credits-screen h2 {
    font-size: 55px;
  }

  .credit-line {
    font-size: 16px;
    letter-spacing: 1px;
  }

  #back-button {
    font-size: 32px;
  }

  #footer {
    font-size: 9px;
    letter-spacing: 2px;
  }
}
</style>
</head>

<body>

<audio id="menu-audio" loop preload="auto">
  <source src="efeito%20sonoro%20tela%20inicial%20do%20jogo%20ULTIMO%20SINAL%20-%20AB%20GAMES.mp3" type="audio/mpeg">
</audio>

<div id="start">

  <div id="brand">AB GAMES</div>

  <h1>O ÚLTIMO<br>SINAL</h1>

  <button class="menu-button" id="jogar">
    JOGAR
  </button>

  <button class="menu-button" id="creditos" onclick="abrirCreditos()">
    CRÉDITOS
  </button>

  <button id="sound-button" onclick="alternarSom()">
    🔊 ATIVAR SOM
  </button>

  <div id="footer">
    UMA EXPERIÊNCIA DE TERROR E SUSPENSE
  </div>

</div>

<div id="credits-screen">

  <h2>CRÉDITOS</h2>

  <p class="credit-line">
    RESPONSÁVEL: <strong>Victor Hugo Cesário Velloso</strong>
  </p>

  <p class="credit-line">
    DESENVOLVEDOR: <strong>Hebert Renan Velloso</strong>
  </p>

  <p class="credit-line">
    <strong>AB GAMES</strong>
  </p>

  <button class="menu-button" id="back-button" onclick="voltarMenu()">
    VOLTAR
  </button>

</div>

<script>
const audio = document.getElementById("menu-audio");
const soundButton = document.getElementById("sound-button");

audio.volume = 0.25;

async function alternarSom() {
  if (audio.paused) {
    try {
      await audio.play();
      soundButton.textContent = "🔇 DESLIGAR SOM";
    } catch (erro) {
      soundButton.textContent = "SOM INDISPONÍVEL";
    }
  } else {
    audio.pause();
    soundButton.textContent = "🔊 ATIVAR SOM";
  }
}

function abrirCreditos() {
  document.getElementById("start").style.display = "none";
  document.getElementById("credits-screen").style.display = "flex";
  audio.pause();
  soundButton.textContent = "🔊 ATIVAR SOM";
}

function voltarMenu() {
  document.getElementById("credits-screen").style.display = "none";
  document.getElementById("start").style.display = "block";
}
</script>

</body>
</html>
