
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AB GAMES — O Último Sinal</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
}

#start {
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.65)),
    url("video%20da%20tela%20inicial%20AB%20GAMES.gif")
    center center / cover no-repeat;
}

#brand {
  position: absolute;
  top: 25px;
  left: 25px;
  color: #35aaff;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 4px;
  text-shadow: 0 2px 10px black;
}

h1 {
  position: absolute;
  top: 20px;
  right: 30px;
  margin: 0;
  color: #e00000;
  font-family: 'Creepster', Georgia, serif;
  font-size: clamp(45px, 7vw, 85px);
  font-weight: normal;
  line-height: 0.9;
  letter-spacing: 4px;
  text-align: right;
  text-shadow: 0 0 12px #8b0000, 2px 3px 12px black;
}

/* JOGAR SEM BLOCO */
#jogar {
  position: absolute;
  top: 50%;
  left: 7%;
  transform: translateY(-50%);

  background: transparent;
  border: none;
  padding: 0;

  color: #e00000;
  font-family: 'Creepster', Georgia, serif;
  font-size: 48px;
  letter-spacing: 3px;

  text-shadow: 0 0 12px #8b0000, 2px 3px 12px black;
  cursor: pointer;
  transition: 0.3s;
}

#jogar:hover {
  color: #ff3333;
  transform: translateY(-50%) scale(1.12);
}

#footer {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  color: #aaa;
  font-size: 11px;
  letter-spacing: 3px;
  text-shadow: 0 2px 10px black;
}

@media (max-width: 600px) {
  #brand {
    top: 18px;
    left: 15px;
    font-size: 16px;
  }

  h1 {
    top: 20px;
    right: 15px;
    font-size: 48px;
  }

  #jogar {
    left: 7%;
    font-size: 38px;
  }

  #footer {
    font-size: 9px;
    letter-spacing: 2px;
  }
}
</style>
</head>

<body>

<div id="start">

  <div id="brand">AB GAMES</div>

  <h1>O ÚLTIMO<br>SINAL</h1>

  <button id="jogar">JOGAR</button>

  <div id="footer">
    UMA EXPERIÊNCIA DE TERROR E SUSPENSE
  </div>

</div>

</body>
</html>
